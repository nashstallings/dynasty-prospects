name: Deploy

# Publishes web/ to GitHub Pages on every push to main that changes something
# the site actually serves. A notebook or infra-script edit does not warrant
# a new publish.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # The scheduled refresh calls this directly. It has to: a push made with
  # GITHUB_TOKEN deliberately does not trigger the push trigger above, so a
  # rebuilt dashboard.json would otherwise sit in main and never reach the
  # published site.
  workflow_call:

# Never let an older build land on top of a newer one.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write # for GitHub's Pages deployment token, not GCP

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

      # A successful deployment only means Pages accepted the artifact.
      # This proves the page actually serves.
      - name: Prove it's live
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS "${{ steps.deployment.outputs.page_url }}" >/dev/null 2>&1; then
              echo "::notice::${{ steps.deployment.outputs.page_url }} is live"
              exit 0
            fi
            sleep 4
          done
          echo "::error::${{ steps.deployment.outputs.page_url }} never answered"
          exit 1
