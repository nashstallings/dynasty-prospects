[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynasty-prospects"
version = "0.1.0"
description = "2027 dynasty rookie draft prospect data pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas-gbq",
    "google-cloud-bigquery",
    "pandas",
    "appdirs",
    "fastparquet",
]

# cfbd (dynasty_prospects) and nflreadpy (nfl_data) are split into extras,
# not both listed as base dependencies, because they pin incompatible
# pydantic majors (cfbd==5.20.1 requires pydantic<2, nflreadpy requires
# pydantic>=2). The two pipelines never run in the same process, so
# installing only the extra a given notebook actually needs avoids asking
# pip to satisfy both pins in one resolve. See notebooks/colab_runner.ipynb
# (installs .[cfbd]) and notebooks/nfl_data_runner.ipynb (installs .[nfl]).
[project.optional-dependencies]
cfbd = ["cfbd==5.20.1"]
nfl = ["nflreadpy", "sleeper-api-wrapper", "polars"]

# nfl_data_py==0.3.3 (used only by dynasty_prospects/combine.py, unrelated to
# the nflreadpy-based nfl_data package) pins pandas<2.0/numpy<2.0, which
# forces pip's resolver to downgrade pandas project-wide and breaks the build
# on Python 3.12 (no wheel for pandas 1.5.3). It imports and runs fine
# against pandas 2.x/3.x in practice, so it's installed separately with
# --no-deps (see requirements.txt / notebooks/colab_runner.ipynb) instead of
# being listed here.

[tool.setuptools.packages.find]
where = ["src"]
