[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynasty-prospects"
version = "0.1.0"
description = "2027 dynasty rookie draft prospect data pipeline"
requires-python = ">=3.10"
dependencies = [
    "cfbd==5.20.1",
    "pandas-gbq",
    "google-cloud-bigquery",
    "pandas",
    "nfl_data_py",
]

[tool.setuptools.packages.find]
where = ["src"]
